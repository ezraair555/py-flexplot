[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-flexplot"
version = "0.1.1"
description = "Python port of Dustin Fife's R visualization and analysis packages (flexplot, fifer, etc.)"
readme = "README.md"
authors = [
  { name = "John C. Vallier", email = "jcvallier.cpa@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.11",
  "plotnine>=0.12",
  "statsmodels>=0.14",
  "patsy>=0.5",
  "scikit-learn>=1.2",
  "semopy>=2.3"
]

[project.urls]
Homepage = "https://github.com/ezraair555/py-flexplot"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
