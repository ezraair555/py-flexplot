name: Torch backend tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/pyflexplot/flex_nn.py"
      - "tests/test_flex_nn.py"
      - "tests/test_flex_nn_integration.py"
      - ".github/workflows/torch.yml"
  schedule:
    # Weekly run to catch upstream torch regressions.
    - cron: "0 6 * * 1"

jobs:
  torch-tests:
    name: pytest with torch (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Install torch (CPU)
      run: |
        pip install pytest pytest-cov
        pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Run flex_nn tests
      run: |
        pytest tests/test_flex_nn.py tests/test_flex_nn_integration.py -v